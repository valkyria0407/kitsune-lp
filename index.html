<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d22">
<title>子狐の初午</title>
<meta name="description" content="王子の狐の物語。赤羽・東十条・王子の町を歩く物語（KITA IDEA NEXT 2026 応募用の企画試作）。おとな向けとこども向けのページがあります。">
<script>
  // 前に選んだページがあれば、そのまま開く（?choose のときは選びなおし）
  (() => {
    if (new URLSearchParams(location.search).has('choose')) return;
    let c = null;
    try { c = localStorage.getItem('kitsune-lp-choice'); } catch {}
    if (c === 'adult') location.replace('adult.html');
    else if (c === 'kids') location.replace('kids.html');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --night: #0b0d22;
  --ink: #f1e8d4;
  --ink-dim: #c2b9a6;
  --ink-faint: #8a8597;
  --fire: #ffd27a;
  --line: rgba(241, 232, 212, .22);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: radial-gradient(120% 70% at 50% 0%, #1c2050 0%, var(--night) 60%) var(--night);
  color: var(--ink);
  font-family: "Shippori Mincho B1", serif;
  min-height: 100vh; min-height: 100dvh;
  display: grid; place-items: center;
  padding: 40px 16px calc(40px + env(safe-area-inset-bottom));
}
main { width: 100%; max-width: 520px; text-align: center; }
.from { font-size: 12px; letter-spacing: .3em; color: var(--ink-faint); margin: 0 0 14px; }
h1 { font-size: clamp(26px, 7vw, 34px); font-weight: 800; letter-spacing: .12em; margin: 0 0 12px; }
.lead { color: var(--ink-dim); font-size: 15px; line-height: 1.9; margin: 0 0 32px; }
.choices { display: grid; gap: 14px; }
.choice {
  display: block; text-decoration: none; color: var(--ink);
  border: 1px solid var(--line); border-radius: 16px;
  padding: 20px 20px 18px; background: rgba(255, 255, 255, .04);
  transition: border-color .2s ease, background .2s ease, transform .2s ease;
}
.choice:hover, .choice:focus-visible { border-color: var(--fire); background: rgba(255, 210, 122, .08); outline: none; }
.choice:active { transform: scale(.98); }
.choice .who { display: block; font-size: 13px; letter-spacing: .2em; color: var(--fire); margin-bottom: 6px; }
.choice .name { display: block; font-size: 22px; font-weight: 700; letter-spacing: .1em; }
.choice .about { display: block; font-size: 13px; color: var(--ink-dim); margin-top: 8px; line-height: 1.7; }
.choice.kids .name, .choice.kids .about { font-family: "Zen Maru Gothic", sans-serif; }
.note { font-size: 12px; color: var(--ink-faint); line-height: 1.8; margin: 32px 0 0; }
</style>
</head>
<body>
<main>
  <p class="from">王子の狐の物語</p>
  <h1>どちらで読みますか？</h1>
  <p class="lead">同じ物語を、おとな向けとこども向けの<br>ふたつのページでご用意しています。</p>
  <div class="choices">
    <a class="choice adult" href="adult.html" data-choice="adult">
      <span class="who">おとな向け</span>
      <span class="name">子狐の初午</span>
      <span class="about">赤羽・東十条・王子の町を歩く、狐と人間の物語</span>
    </a>
    <a class="choice kids" href="kids.html" data-choice="kids">
      <span class="who">こども向け（小学1〜3年生）</span>
      <span class="name">こぎつねの おねがい</span>
      <span class="about">おてがみを よんで、まちを たんけんしよう</span>
    </a>
  </div>
  <p class="note">選んだページは、次から自動でひらきます。<br>各ページのいちばん下から、この画面に戻って選びなおせます。</p>
</main>
<script>
  document.querySelectorAll('.choice').forEach(a => a.addEventListener('click', () => {
    try { localStorage.setItem('kitsune-lp-choice', a.dataset.choice); } catch {}
  }));
</script>
</body>
</html>
